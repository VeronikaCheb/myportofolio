<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_project' %}">Projects</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="{% static 'img/veronika.JPG' %}" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>

                    <!-- ===== CAROUSEL 1 ===== -->
                    <div class="carousel">
                        <div class="carousel-track">
                            <img src="{% static 'img/image1.png' %}" alt="Skills 1" id="slide1">
                            <img src="{% static 'img/image2.png' %}" alt="Skills 2" id="slide2">
                        </div>
                        <a href="#slide2" class="carousel-btn next show-on-1">❯</a>
                        <a href="#slide1" class="carousel-btn prev show-on-2">❮</a>
                    </div>

                    <!-- ===== CAROUSEL 2 ===== -->
                    <div class="carousel">
                        <div class="carousel-track">
                            <img src="{% static 'img/image3.png' %}" alt="Skills 3" id="slide3">
                            <img src="{% static 'img/image4.png' %}" alt="Skills 4" id="slide4">
                        </div>
                        <a href="#slide4" class="carousel-btn next show-on-3">❯</a>
                        <a href="#slide3" class="carousel-btn prev show-on-4">❮</a>
                    </div>

                    <!-- ===== CAROUSEL 3 ===== -->
                    <div class="carousel">
                        <div class="carousel-track">
                            <img src="{% static 'img/image5.png' %}" alt="Skills 5" id="slide5">
                            <img src="{% static 'img/image6.png' %}" alt="Skills 6" id="slide6">
                        </div>
                        <a href="#slide6" class="carousel-btn next show-on-5">❯</a>
                        <a href="#slide5" class="carousel-btn prev show-on-6">❮</a>
                    </div>

                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/VeronikaCheb/myportofolio" class="social-link">GitHub</a>
                        <a href="https://linkedin.com/in/veronika-chebotareva" class="social-link">LinkedIn</a>
                        <a href="mailto:tilch1709@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>

</body>
</html>
